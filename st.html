        console.log('[Hatsu ST Loader] 零安装直接桥接（In-page Bridge）启动成功。');
      } catch (err) {
        console.error('[Hatsu ST Loader] 启动直接桥接失败：', err);
        alert('[st.html Bridge Import Error] ' + String(err.stack || err.message || err));
      }
    }

    // ── 桥接辅助函数 ──
    const CHAT_STATE_METADATA_KEY = 'hatsuboshi_produce_state_v1';
    const lastAcceptedHostSaveSequenceByScope = new Map();
    const HATSU_COMMIT_EVENT_NAME = 'hatsuAssistantCommitted';
    const useCommittedReplyEvent = true;
    const useTransactionalBridge = true;
    const useVisualHideFloors = true;
    let pendingRequestId = '';
    let pendingChannelLeaseId = '';
    let pendingPromptSentAt = 0;
    let pendingPromptChatLength = 0;
    let pendingCandidateInFlight = false;
    let pendingCandidateMessageId = -1;
    let pendingReplyRetryTimer = 0;
    let pendingStreamFinalizeTimer = 0;
    let pendingStreamMessageId = -1;
    let hiddenFloorRange = null;
    let chatDomObserver = null;
    let chatDomUpdateTimer = 0;
    const requestPromptCache = new Map();
    const activeHostGenerationAttempts = new Map();
    const HOST_GENERATION_MODES = new Set(['opening_quiet', 'shujuku_same_layer']);

    function createHostGenerationAttemptKey(requestId, channelLeaseId, saveScope) {
      return [requestId, channelLeaseId, saveScope].map((value) => String(value || '')).join('::');
    }

    function normalizeHostGenerationEnvelope(data) {
      const requestId = String(data?.requestId || '');
      const channelLeaseId = String(data?.channelLeaseId || '');
      const saveScope = String(data?.saveScope || '');
      const generationMode = String(data?.generationMode || '');
      const prompt = String(data?.prompt || '');
      if (!requestId || !channelLeaseId || !saveScope || !prompt.trim() || !HOST_GENERATION_MODES.has(generationMode)) {
        return { ok: false, reason: 'invalid_generation_envelope' };
      }
      return {
        ok: true,
        requestId,
        channelLeaseId,
        saveScope,
        ownerKind: String(data?.ownerKind || 'legacy_main'),
        generationMode,
        prompt,
        turnId: String(data?.turnId || ''),
        attemptKey: createHostGenerationAttemptKey(requestId, channelLeaseId, saveScope)
      };
    }

    function createHostPromptCacheEntry(envelope) {
      return {
        prompt: envelope.prompt,
        generationMode: envelope.generationMode,
        saveScope: envelope.saveScope,
        ownerKind: envelope.ownerKind,
        turnId: envelope.turnId,
        requestId: envelope.requestId,
        channelLeaseId: envelope.channelLeaseId,
        attemptKey: envelope.attemptKey
      };
    }

    function createHostGenerationAttempt(envelope) {
      return {
        ...envelope,
        status: 'prepared',
        userMessageId: null,
        assistantMessageId: null,
        startedAt: Date.now()
      };
    }

    async function prepareSameLayerAttempt(envelope, deps) {
      deps = deps && typeof deps === 'object' ? deps : {};
      const attempts = deps.activeAttempts || activeHostGenerationAttempts;
      const existing = attempts.get(envelope.attemptKey);
      if (existing) return existing;

      const attempt = createHostGenerationAttempt(envelope);
      attempts.set(attempt.attemptKey, attempt);
      const createMessage = deps.createSilentChatMessage || createSilentChatMessage;
      const stampMessage = deps.stampTransactionalExtra || stampTransactionalExtra;
      const persistChat = deps.persistChatSilently || persistChatSilently;
      const readContext = deps.getContext || getContext;
      try {
        const messageId = await createMessage('user', envelope.prompt, envelope.requestId, attempt);
        const targetMessage = readContext()?.chat?.[messageId];
        if (!targetMessage || targetMessage.is_user !== true) {
          throw new Error('same_layer_user_floor_missing');
        }
        targetMessage.is_hidden = true;
        stampMessage(messageId, 'user', envelope.requestId, attempt);
        await persistChat();
        attempt.userMessageId = messageId;
        attempt.status = 'user_floor_committed';
        return attempt;
      } catch (error) {
        if (attempts.get(attempt.attemptKey) === attempt) {
          attempts.delete(attempt.attemptKey);
        }
        throw error;
      }
    }

    async function runOpeningQuietAttempt(envelope, deps) {
      deps = deps && typeof deps === 'object' ? deps : {};
      const context = deps.context || getContext();
      const generateQuietPrompt = deps.generateQuietPrompt || context?.generateQuietPrompt;
      const extractReply = deps.extractReplyTextFromGenerated || extractReplyTextFromGenerated;
      const commitReply = deps.postCommittedReply || postCommittedReply;
      if (!context || typeof generateQuietPrompt !== 'function') {
        throw new Error('opening_quiet_unavailable');
      }
      const generated = await generateQuietPrompt.call(context, {
        quietPrompt: envelope.prompt,
        quietToLoud: false,
        skipWIAN: false,
        removeReasoning: true
      });
      const text = extractReply(generated);
      if (!text) throw new Error('opening_quiet_empty');
      commitReply(envelope.requestId, text, {
        isFinal: true,
        rawText: text,
        renderedText: '',
        messageId: null,
        channelLeaseId: envelope.channelLeaseId
      });
      return {
        requestId: envelope.requestId,
        channelLeaseId: envelope.channelLeaseId,
        text,
        messageId: null
      };
    }

    async function runHostGenerationAttempt(envelope) {
      requestPromptCache.set(envelope.requestId, createHostPromptCacheEntry(envelope));
      if (envelope.generationMode === 'opening_quiet') {
        return runOpeningQuietAttempt(envelope);
      }
      return runTransactionalPrompt(envelope.prompt, envelope.requestId, envelope.channelLeaseId);
    }
    let promptTaskQueue = Promise.resolve();

    function getSillyTavernGlobal() {
      const candidates = [];
      try {
        if (window.parent && window.parent !== window) candidates.push(window.parent.SillyTavern);
      } catch (e) {}
      try {
        candidates.push(window.SillyTavern);
      } catch (e) {}
      return candidates.find(api => api && typeof api.getContext === 'function') || null;
    }

    function getContext() {
      try {
        return getSillyTavernGlobal()?.getContext?.() || null;
      } catch (e) {
        console.warn('[st.html] getContext failed:', e);
        return null;
      }
    }

    // 酒馆助手 (TavernHelper / JS-Slash-Runner) 注入的封装接口。它的 generate 能把提示词
    // 作为 user_input 显式传入、只返回文本不建楼；createChatMessages 用 {role,message} 格式
    // 并支持 refresh:'affected' 只刷新单楼。优先用它，拿不到再退回裸 getContext()。
    function getTavernHelper() {
      const candidates = [];
      try {
        if (window.parent && window.parent !== window) candidates.push(window.parent.TavernHelper);
      } catch (e) {}
      try {
        candidates.push(window.TavernHelper);
      } catch (e) {}
      return candidates.find((api) => api && (typeof api.generate === 'function' || typeof api.getChatMessages === 'function')) || null;
    }

    function postToFrame(payload) {
      window.postMessage(payload, '*');
      try {
        const frame = document.getElementById('hatsu-st-page');
        frame?.contentWindow?.postMessage(payload, '*');
      } catch (error) {
        // 忽略跨域 frame 投递失败。
      }
    }

    function resolveChronicleWorldbookName(context) {
      const character = context?.characters?.[context.characterId];
      const linked = String(character?.data?.extensions?.world || '').trim();
      if (linked) return linked;
      const names = context?.getWorldInfoNames?.() || [];
      return names.length === 1 ? String(names[0] || '').trim() : '';
    }

    async function ensureChronicleWorldbookEntry(context, bookName) {
      const api = globalThis.HatsuChronicle;
      if (!api || !context?.loadWorldInfo || !bookName) return null;
      const data = await context.loadWorldInfo(bookName);
      if (!data?.entries) return null;
      let uid = api.findChronicleEntryUid(data.entries);
      if (!uid) {
        uid = String(api.nextWorldInfoEntryUid(data.entries));
        data.entries[uid] = api.buildChronicleEntryTemplate(Number(uid));
      }
      return { data, uid: String(uid) };
    }

    async function saveChronicleWorldbook(context, bookName, data) {
      if (!context?.saveWorldInfo || !bookName || !data) return;
      await context.saveWorldInfo(bookName, data, true);
    }

    async function updateChronicleWorldbook(messageId, sumText) {
      const api = globalThis.HatsuChronicle;
      const context = getContext();
      if (!api || !context) return;
      const entryNo = api.assistantMessageIdToEntryNo(messageId);
      const summary = String(sumText || '').trim();
      if (!entryNo || !summary) return;
      const bookName = resolveChronicleWorldbookName(context);
      if (!bookName) {
        console.warn('[st.html] 未找到角色绑定的世界书，无法写入编年史。');
        return;
      }
      const ensured = await ensureChronicleWorldbookEntry(context, bookName);
      if (!ensured) return;
      const { data, uid } = ensured;
      const previous = String(data.entries[uid]?.content || '');
      data.entries[uid].content = api.upsertChronicleContent(previous, entryNo, summary, { pruneAfterReroll: true });
      data.entries[uid].comment = api.CHRONICLE_ENTRY_COMMENT;
      data.entries[uid].constant = true;
      data.entries[uid].disable = false;
      await saveChronicleWorldbook(context, bookName, data);
    }

    async function pruneChronicleWorldbookAfter(entryNo) {
      const api = globalThis.HatsuChronicle;
      const context = getContext();
      if (!api || !context) return;
      const no = Number(entryNo);
      if (!Number.isInteger(no) || no <= 0) return;
      const bookName = resolveChronicleWorldbookName(context);
      if (!bookName) return;
      const ensured = await ensureChronicleWorldbookEntry(context, bookName);
      if (!ensured) return;
      const { data, uid } = ensured;
      data.entries[uid].content = api.pruneChronicleContentAfter(String(data.entries[uid]?.content || ''), no);
      await saveChronicleWorldbook(context, bookName, data);
    }

    async function listChronicleCheckpointsFromHost() {
      const api = globalThis.HatsuChronicle;
      const context = getContext();
      const helper = getTavernHelper();
      if (!api || !context) return [];
      const lastIndex = Math.max(0, (context.chat?.length || 1) - 1);
      let messages = [];
      if (helper?.getChatMessages) {
        const range = `0-${lastIndex}`;
        try {
          messages = await helper.getChatMessages(range, { include_swipes: true });
        } catch (error) {
          messages = await helper.getChatMessages(range);
        }
      } else if (Array.isArray(context.chat)) {
        messages = context.chat.map((message, index) => ({
          message_id: index,
          role: message?.is_user ? 'user' : 'assistant',
          message: message?.mes,
          is_user: message?.is_user
        }));
      }
      if (!Array.isArray(messages)) return [];
      return messages
        .map((message, index) => api.buildCheckpointFromMessage(message, index))
        .filter(Boolean)
        .sort((a, b) => b.messageId - a.messageId);
    }

    async function branchToChronicleCheckpoint(messageId) {
      const api = globalThis.HatsuChronicle;
      const id = Number(messageId);
      if (!Number.isInteger(id) || id < 0) throw new Error('无效的楼层编号');
      const entryNo = api?.assistantMessageIdToEntryNo(id);
      if (entryNo > 0) await pruneChronicleWorldbookAfter(entryNo);
      const helper = getTavernHelper();
      if (!helper?.triggerSlash) throw new Error('需要安装酒馆助手并启用 triggerSlash');
      await helper.triggerSlash(`/branch-create ${id}`);
      window.location.reload();
    }

    function resolveAssistantMessageId(explicitId) {
      if (explicitId === null) return -1;
      const id = Number(explicitId);
      if (Number.isInteger(id) && id >= 0) return id;
      const chat = getContext()?.chat;
      if (!Array.isArray(chat) || !chat.length) return -1;
      for (let index = chat.length - 1; index >= 0; index -= 1) {
        const message = chat[index];
        if (message && message.is_user === false) return index;
      }
      return chat.length - 1;
    }

    function decideHostStateSave(input) {
      input = input && typeof input === 'object' ? input : {};
      const incomingScope = String(input.incomingScope || '');
      const currentScope = String(input.currentScope || '');
      const nextState = input.nextState;
      const normalizedSequence = Number.isInteger(Number(input.incomingSequence)) && Number(input.incomingSequence) > 0
        ? Number(input.incomingSequence)
        : 0;
      const lastAcceptedSequence = Math.max(0, Math.floor(Number(input.lastAcceptedSequence) || 0));
      const hasVersionedHistory = Boolean(input.hasVersionedHistory || lastAcceptedSequence > 0);
      if (!incomingScope || !currentScope || incomingScope !== currentScope) {
        return { accepted: false, reason: 'scope_mismatch', normalizedSequence };
      }
      if (!nextState || typeof nextState !== 'object' || Array.isArray(nextState)) {
        return { accepted: false, reason: 'invalid_state', normalizedSequence };
      }
      if (!normalizedSequence) {
        return {
          accepted: !hasVersionedHistory,
          reason: hasVersionedHistory ? 'legacy_after_versioned' : 'legacy_accepted',
          normalizedSequence: 0
        };
      }
      if (normalizedSequence === lastAcceptedSequence) {
        return { accepted: false, reason: 'duplicate_sequence', normalizedSequence };
      }
      if (normalizedSequence < lastAcceptedSequence) {
        return { accepted: false, reason: 'stale_sequence', normalizedSequence };
      }
      return { accepted: true, reason: 'accepted', normalizedSequence };
    }

    function getLastAcceptedHostSaveSequence(saveScope) {
      const scope = String(saveScope || '');
      if (!scope) return 0;
      const remembered = Math.max(0, Math.floor(Number(lastAcceptedHostSaveSequenceByScope.get(scope)) || 0));
      const envelope = getContext()?.chatMetadata?.[CHAT_STATE_METADATA_KEY];
      const persisted = envelope && String(envelope.saveScope || '') === scope
        ? Math.max(0, Math.floor(Number(envelope.hostSaveSequence) || 0))
        : 0;
      return Math.max(remembered, persisted);
    }

    function hasVersionedHostSaveHistory(saveScope) {
      const scope = String(saveScope || '');
      if (!scope) return false;
      if (getLastAcceptedHostSaveSequence(scope) > 0) return true;
      const envelope = getContext()?.chatMetadata?.[CHAT_STATE_METADATA_KEY];
      return Boolean(
        envelope
        && String(envelope.saveScope || '') === scope
        && Number(envelope.hostSaveSequence) > 0
      );
    }

    function shouldAcceptHostSave(incomingScope, currentScope, nextState, incomingSequence, lastAcceptedSequence, hasVersionedHistory) {
      return decideHostStateSave({
        incomingScope,
        currentScope,
        nextState,
        incomingSequence,
        lastAcceptedSequence,
        hasVersionedHistory
      }).accepted;
    }
    function getCurrentContextInfo() {
      const context = getContext();
      const characterId = context?.characterId;
      const character = Array.isArray(context?.characters) && Number.isInteger(Number(characterId))
        ? context.characters[Number(characterId)]
        : null;
      const groupId = context?.groupId || context?.groups?.selected || '';
      const chatId = context?.chatId
        || context?.chatMetadata?.chat_id
        || context?.chatMetadata?.file_name
        || context?.chatMetadata?.fileName
        || context?.chatFile
        || 'default-chat';
      
      const mainDoc = window.parent?.document || document;
      const characterName = character?.name || context?.name2 || mainDoc.querySelector('#avatar_div .ch_name')?.textContent?.trim() || '';
      const actorScope = groupId
        ? `group-${groupId}`
        : `char-${Number.isInteger(Number(characterId)) ? characterId : characterName.replace(new RegExp("[\\\\/:*?\\\"<>|\\s]+", "g"), '_')}`;
      
      console.log('[st.html] getCurrentContextInfo contextName2:', context?.name2, 'charName:', character?.name, 'resolvedName:', characterName);

      return {
        character: {
          name: characterName,
          avatar: character?.avatar || character?.avatarFileName || ''
        },
        saveScope: `${actorScope}-chat-${chatId.replace(new RegExp("[\\\\/:*?\\\"<>|\\s]+", "g"), '_')}`
      };
    }

    function updateInPageHatsuClass() {
      const contextInfo = getCurrentContextInfo();
      const characterName = contextInfo.character?.name || '';
      const isHatsu = characterName.includes('初星学园') || characterName.includes('初星') || characterName.includes('Hatsuboshi');
      
      const targets = [document.body];
      try {
        if (window.parent?.document?.body) {
          targets.push(window.parent.document.body);
        }
      } catch (e) {}

      targets.forEach(body => {
        if (isHatsu) {
          body.classList.add('hatsuboshi-active');
        } else {
          body.classList.remove('hatsuboshi-active');
        }
      });
    }

    function getHostMainDocument() {
      try {
        return window.parent?.document || document;
      } catch (error) {
        return document;
      }
    }

    function computeHiddenFloorRange() {
      if (!useVisualHideFloors) return null;
      const mainDoc = getHostMainDocument();
      const floorIds = [...mainDoc.querySelectorAll('#chat > .mes[mesid]')]
        .map((node) => Number(node.getAttribute('mesid')))
        .filter((value) => Number.isInteger(value) && value >= 0)
        .sort((a, b) => a - b);
      if (floorIds.length <= 1) return null;
      const latest = floorIds[floorIds.length - 1];
      if (!Number.isInteger(latest) || latest <= 0) return null;
      return { start: 0, end: latest - 1 };
    }

    function isFloorHidden(mesId) {
      const id = Number(mesId);
      if (!Number.isInteger(id) || !hiddenFloorRange) return false;
      return id >= hiddenFloorRange.start && id <= hiddenFloorRange.end;
    }

    function adjustMessageVisibility() {
      const mainDoc = getHostMainDocument();
      const contextInfo = getCurrentContextInfo();
      const characterName = contextInfo.character?.name || '';
      const isHatsu = characterName.includes('初星学园') || characterName.includes('初星') || characterName.includes('Hatsuboshi');
      hiddenFloorRange = isHatsu ? computeHiddenFloorRange() : null;
      const floors = mainDoc.querySelectorAll('#chat > .mes[mesid]');
      floors.forEach((floor) => {
        const mesId = floor.getAttribute('mesid');
        floor.style.display = isFloorHidden(mesId) ? 'none' : '';
      });
    }

    function bindChatDomObserver() {
      if (chatDomObserver) return;
      const mainDoc = getHostMainDocument();
      const target = mainDoc.querySelector('#chat');
      if (!target) return;
      chatDomObserver = new MutationObserver(() => {
        if (chatDomUpdateTimer) return;
        chatDomUpdateTimer = window.setTimeout(() => {
          chatDomUpdateTimer = 0;
          adjustMessageVisibility();
        }, 120);
      });
      chatDomObserver.observe(target, { childList: true, subtree: false });
    }

    function getSavedChatState() {
      const context = getContext();
      const envelope = context?.chatMetadata?.[CHAT_STATE_METADATA_KEY];
      if (!envelope || typeof envelope !== 'object' || Array.isArray(envelope)) return null;
      return envelope.state;
    }

    function saveChatState(state, saveScope, hostSaveSequence) {
      const context = getContext();
      const metadata = context?.chatMetadata;
      if (!metadata) return;
      metadata[CHAT_STATE_METADATA_KEY] = {
        version: 2,
        saveScope: String(saveScope || ''),
        hostSaveSequence: Math.max(0, Math.floor(Number(hostSaveSequence) || 0)),
        updatedAt: Date.now(),
        state: JSON.parse(JSON.stringify(state)),
      };
      context.saveMetadataDebounced?.();
    }

    function queuePromptTask(task) {
      promptTaskQueue = promptTaskQueue
        .then(() => task())
        .catch((error) => {
          console.error('[st.html] prompt task failed:', error);
        });
      return promptTaskQueue;
    }

    function buildTransactionalMessage(role, text, requestId) {
      const context = getContext();
      return {
        name: role === 'user' ? String(context?.name1 || 'User') : String(context?.name2 || 'Assistant'),
        is_user: role === 'user',
        is_system: false,
        send_date: Date.now(),
        mes: String(text || ''),
        extra: {
          hatsuRequestId: String(requestId || ''),
          hatsuTxnRole: role,
          hatsuTxnAt: Date.now()
        }
      };
    }

    function resolveCreateChatMessagesFn(context) {
      const globalST = getSillyTavernGlobal();
      const candidates = [
        context?.createChatMessages,
        globalST?.createChatMessages,
        window.parent?.createChatMessages,
        window.createChatMessages
      ];
      return candidates.find((fn) => typeof fn === 'function') || null;
    }

    async function tryCreateByHostApi(createChatMessages, role, message) {
      const hostOptions = {
        triggerGenerate: false,
        doGenerate: false,
        generate: false,
        shouldGenerate: false,
        refresh: false,
        shouldRefresh: false,
        refreshUi: false,
        redraw: false,
        scroll: false,
        silent: true,
        source: 'hatsu-transaction'
      };
      const calls = [
        () => createChatMessages([message], hostOptions),
        () => createChatMessages(message, hostOptions),
        () => createChatMessages(role, message.mes, hostOptions),
        () => createChatMessages(role, message.mes, false, false),
        () => createChatMessages(role, message.mes)
      ];
      for (const invoke of calls) {
        try {
          await invoke();
          return true;
        } catch (error) {
          // 向下兼容不同宿主签名，单次失败不终止。
        }
      }
      return false;
    }

    function findTransactionalMessageIndex(chat, role, text, requestId, minIndex = 0) {
      if (!Array.isArray(chat) || !chat.length) return -1;
      const expectedText = String(text || '').trim();
      const expectedReqId = String(requestId || '');
      const isUser = role === 'user';
      for (let index = chat.length - 1; index >= minIndex; index -= 1) {
        const item = chat[index];
        if (!item || Boolean(item.is_user) !== isUser) continue;
        const reqId = String(item?.extra?.hatsuRequestId || '');
        const mes = String(item?.mes || '').trim();
        if (expectedReqId && reqId === expectedReqId) return index;
        if (expectedText && mes === expectedText) return index;
      }
      return -1;
    }

    async function waitForTransactionalMessage(role, text, requestId, minIndex = 0) {
      for (let attempts = 0; attempts < 8; attempts += 1) {
        const context = getContext();
        const index = findTransactionalMessageIndex(context?.chat, role, text, requestId, minIndex);
        if (index >= 0) return index;
        await new Promise((resolve) => setTimeout(resolve, 30));
      }
      return -1;
    }

    function extractReplyTextFromGenerated(generated) {
      if (typeof generated === 'string') return generated.trim();
      if (!generated || typeof generated !== 'object') return '';
      // 酒馆 Generate 常返回 `new String(text)` 包装对象 (typeof 为 'object')，
      // 直接 String() 取回原文，否则会被当成空字符串漏掉。
      if (generated instanceof String) return String(generated).trim();
      const wrapped = (generated.valueOf && typeof generated.valueOf() === 'string') ? String(generated.valueOf()).trim() : '';
      if (wrapped) return wrapped;
      const candidates = [
        generated.text,
        generated.mes,
        generated.message,
        generated.content
      ];
      for (const candidate of candidates) {
        const text = typeof candidate === 'string' ? candidate.trim() : '';
        if (text) return text;
      }
      if (Array.isArray(generated.swipes) && generated.swipes.length > 0) {
        const swipeText = String(generated.swipes[generated.swipe_id] || generated.swipes[0] || '').trim();
        if (swipeText) return swipeText;
      }
      return '';
    }


    function getGenerationPayloadRequestId(generated) {
      if (!generated || typeof generated !== 'object') return '';
      return String(
        generated.generation_id
        || generated.generationId
        || generated.requestId
        || generated.request_id
        || generated.id
        || ''
      );
    }

    function isGenerationEndedPayloadForRequest(generated, requestId) {
      const reqId = String(requestId || '');
      const eventReqId = getGenerationPayloadRequestId(generated);
      return Boolean(reqId && eventReqId && eventReqId === reqId);
    }

    function normalizeGenerationEndedText(generated, requestId) {
      const reqId = String(requestId || '');
      const eventReqId = getGenerationPayloadRequestId(generated);
      if (eventReqId && reqId && eventReqId !== reqId) return null;
      return extractReplyTextFromGenerated(generated);
    }

    function hasCompleteOptionPayload(text) {
      const value = String(text || '');
      return /<option1\b[^>]*>[\s\S]*?<\/option1>/i.test(value)
        && /<option2\b[^>]*>[\s\S]*?<\/option2>/i.test(value)
        && /<option3\b[^>]*>[\s\S]*?<\/option3>/i.test(value)
        && /<option4\b[^>]*>[\s\S]*?<\/option4>/i.test(value);
    }

    function isGeneratedTextCompatibleWithPrompt(promptText, generatedText) {
      const prompt = String(promptText || '');
      const reply = String(generatedText || '').trim();
      if (!reply) return false;
      const firstChoiceLabel = '\u7b2c\u4e00\u8f6e\u9009\u62e9';
      const interactionChoiceLabel = '\u4e92\u52a8\u5206\u652f\u8bbe\u8ba1';
      const bondEventLabel = '\u7f81\u7eca\u4e8b\u4ef6';
      const promptHasOptionSeed = /<option1\b/i.test(prompt);
      const expectsFirstChoice = prompt.includes(firstChoiceLabel) && promptHasOptionSeed;
      const expectsChoicePayload = expectsFirstChoice
        || (prompt.includes(interactionChoiceLabel) && promptHasOptionSeed)
        || (prompt.includes(bondEventLabel) && promptHasOptionSeed);
      if (expectsChoicePayload && !hasCompleteOptionPayload(reply)) return false;
      return true;
    }
    function findLatestAssistantReply(chat, requestId = '', minIndex = 0, startedAt = 0) {
      if (!Array.isArray(chat)) return null;
      const reqId = String(requestId || '');
      const mainDoc = getHostMainDocument();
      for (let index = chat.length - 1; index >= minIndex; index -= 1) {
        const message = chat[index];
        if (!message || message.is_user) continue;
        const messageReqId = String(message?.extra?.hatsuRequestId || '');
        if (reqId && messageReqId && messageReqId !== reqId) continue;
        const messageAt = Number(message?.send_date || 0);
        if (startedAt > 0 && Number.isFinite(messageAt) && messageAt > 0 && messageAt + 5 < startedAt) continue;
        const rawText = getMessageRawText(message).trim();
        const renderedText = String(mainDoc.querySelector(`.mes[mesid="${index}"] .mes_text`)?.innerText || '').trim();
        const text = rawText.length >= renderedText.length ? rawText : renderedText;
        if (!text) continue;
        const score =
          (reqId && messageReqId === reqId ? 3 : 0)
          + (index >= minIndex ? 2 : 0)
          + (startedAt > 0 && Number.isFinite(messageAt) && messageAt >= startedAt ? 1 : 0);
        return { index, text, rawText, renderedText, score };
      }
      return null;
    }

    async function waitForLatestAssistantReply(requestId = '', minIndex = 0, startedAt = 0) {
      let fallback = null;
      for (let attempts = 0; attempts < 10; attempts += 1) {
        const context = getContext();
        const hit = findLatestAssistantReply(context?.chat, requestId, minIndex, startedAt);
        if (hit && hit.score >= 3) return hit;
        if (hit && !fallback) fallback = hit;
        await new Promise((resolve) => setTimeout(resolve, 40));
      }
      return fallback;
    }

    function removeGeneratedAssistantMessagesAfter(startIndex, requestId = '') {
      const context = getContext();
      const chat = context?.chat;
      if (!Array.isArray(chat)) return 0;
      const reqId = String(requestId || '');
      let removed = 0;
      for (let index = chat.length - 1; index >= Math.max(0, Number(startIndex) || 0); index -= 1) {
        const message = chat[index];
        if (!message || message.is_user) continue;
        const messageReqId = String(message?.extra?.hatsuRequestId || '');
        if (messageReqId && reqId && messageReqId === reqId) continue;
        chat.splice(index, 1);
        removed += 1;
      }
      if (removed > 0) {
        context.chatMetadata && (context.chatMetadata.tainted = true);
      }
      return removed;
    }

    function renderSilentFloor(messageId) {
      // 把单个楼层渲染进酒馆 DOM，使其真正显示内容（之前只 push 进 chat 数组，
      // 不调用 addOneMessage，导致酒馆里楼层是空的）。addOneMessage 只渲染单条，
      // 不会像 printMessages 那样重绘全部楼层，所以不会让被隐藏的旧楼层冒出来。
      try {
        const context = getContext();
        const chat = context?.chat;
        const idx = Number(messageId);
        if (!Array.isArray(chat) || !Number.isInteger(idx) || idx < 0 || idx >= chat.length) return;
        if (typeof context.addOneMessage !== 'function') return;
        const mainDoc = getHostMainDocument();
        const already = mainDoc.querySelector(`#chat > .mes[mesid="${idx}"]`);
        if (already) {
          const mesText = already.querySelector('.mes_text');
          if (mesText && !String(mesText.innerText || '').trim() && String(chat[idx]?.mes || '').trim()) {
            // 楼层已存在但内容为空：补回内容。
            mesText.innerHTML = context.messageFormatting
              ? context.messageFormatting(String(chat[idx].mes || ''), chat[idx].name, false, Boolean(chat[idx].is_user), idx)
              : String(chat[idx].mes || '');
          }
          return;
        }
        context.addOneMessage(chat[idx], { scroll: false, forceId: idx });
      } catch (error) {
        // 渲染失败不影响事务主流程。
      }
      if (useVisualHideFloors) adjustMessageVisibility();
    }

    function stampTransactionalExtra(messageId, role, requestId, attempt) {
      const context = getContext();
      const targetMessage = context?.chat?.[messageId];
      if (targetMessage) {
        const attemptKey = String(attempt?.attemptKey || '');
        const saveScope = String(attempt?.saveScope || '');
        targetMessage.extra = {
          ...(targetMessage.extra || {}),
          hatsuRequestId: String(requestId || ''),
          hatsuTxnRole: role,
          hatsuTxnAt: targetMessage?.extra?.hatsuTxnAt || Date.now(),
          ...(attemptKey ? { hatsuAttemptKey: attemptKey } : {}),
          ...(saveScope ? { hatsuSaveScope: saveScope } : {}),
          ...(attemptKey ? { _acu_true_same_layer: true } : {})
        };
        if (attemptKey && role === 'user') targetMessage.is_hidden = true;
      }
      context && context.chatMetadata && (context.chatMetadata.tainted = true);
    }

    async function createSilentChatMessage(role, text, requestId, attempt) {
      const context = getContext();
      if (!context || !Array.isArray(context.chat)) throw new Error('chat context unavailable');
      const reqId = String(requestId || '');

      // 优先走酒馆助手：{role,message} 格式 + refresh:'affected' 只刷新本楼，
      // 内容直接写入，不会出现空楼层，也不会触发全楼层重绘。
      const tavernHelper = getTavernHelper();
      if (tavernHelper && typeof tavernHelper.createChatMessages === 'function') {
        try {
          await tavernHelper.createChatMessages(
            [{
              role: role === 'user' ? 'user' : 'assistant',
              message: String(text || ''),
              extra: { hatsuRequestId: reqId, hatsuTxnRole: role, hatsuTxnAt: Date.now() }
            }],
            // refresh:'none' 与 index2 一致：只写入聊天数据、不触碰 DOM，
            // 因此不会把前端所在的楼层顶下去导致前端被重渲染（"顿一下"）。
            { refresh: 'none' }
          );
          const messageId = context.chat.length - 1;
          stampTransactionalExtra(messageId, role, reqId, attempt);
          return messageId;
        } catch (error) {
          console.warn('[st.html] TavernHelper.createChatMessages 失败，回退原生:', error);
        }
      }

      // 兜底：裸 getContext()，手动 push 后用 addOneMessage 单楼渲染。
      const message = buildTransactionalMessage(role, text, requestId);
      const beforeLength = context.chat.length;
      const createChatMessages = resolveCreateChatMessagesFn(context);
      let messageId = -1;
      if (createChatMessages) {
        await tryCreateByHostApi(createChatMessages, role, message);
        messageId = await waitForTransactionalMessage(role, message.mes, requestId, beforeLength);
      }
      if (messageId < 0) {
        context.chat.push(message);
        messageId = context.chat.length - 1;
      }
      stampTransactionalExtra(messageId, role, reqId, attempt);
      renderSilentFloor(messageId);
      return messageId;
    }

    function rollbackSilentUserMessage(index, requestId) {
      const context = getContext();
      if (!context || !Array.isArray(context.chat)) return;
      const idx = Number(index);
      if (!Number.isInteger(idx) || idx < 0 || idx >= context.chat.length) return;
      const message = context.chat[idx];
      if (!message?.is_user) return;
      if (String(message?.extra?.hatsuRequestId || '') !== String(requestId || '')) return;
      context.chat.splice(idx, 1);
      try {
        const mainDoc = getHostMainDocument();
        mainDoc.querySelector(`#chat > .mes[mesid="${idx}"]`)?.remove();
      } catch (error) {
        // 忽略 DOM 清理失败。
      }
    }

    async function persistChatSilently() {
      const context = getContext();
      await context?.saveChat?.();
    }

    function postCommittedReply(requestId, text, options = {}) {
      const messageId = resolveAssistantMessageId(options.messageId);
      const payload = {
        source: 'hatsuboshi-produce-host',
        type: 'aiReplyCommitted',
        requestId: String(requestId || ''),
        channelLeaseId: String(options.channelLeaseId || pendingChannelLeaseId || ''),
        text: String(text || ''),
        rawText: String(options.rawText || text || ''),
        renderedText: String(options.renderedText || ''),
        isFinal: options.isFinal !== false,
        messageId: messageId >= 0 ? messageId : undefined
      };
      window.postMessage(payload, '*');
      dispatchCommittedReplyEvent(payload);
      if (String(pendingRequestId || '') === String(requestId || '')) {
        clearPendingReplyRequest();
      }
    }

    function postPrimaryAiError(requestId, channelLeaseId, error) {
      window.postMessage({
        source: 'hatsuboshi-produce-host',
        type: 'primaryAiError',
        requestId: String(requestId || ''),
        channelLeaseId: String(channelLeaseId || ''),
        error: String(error?.message || error || 'primary_generation_failed')
      }, '*');
    }
    function postSecondaryReply(requestId, text, options = {}) {
      const payload = {
        source: 'hatsuboshi-produce-host',
        type: 'secondaryAiReply',
        requestId: String(requestId || ''),
        text: String(text || ''),
        ok: options.ok !== false,
        error: String(options.error || ''),
        isFinal: true
      };
      window.postMessage(payload, '*');
    }

    async function runSecondaryApiPrompt(promptText, requestId, apiConfig = {}) {
      const prompt = String(promptText || '').trim();
      const reqId = String(requestId || '');
      const baseUrl = String(apiConfig.baseUrl || '').trim().replace(/\/$/, '');
      const apiKey = String(apiConfig.apiKey || '').trim();
      const model = String(apiConfig.model || '').trim();
      const temperature = Number.isFinite(Number(apiConfig.temperature)) ? Number(apiConfig.temperature) : 0.7;
      const maxTokens = Number.isFinite(Number(apiConfig.maxTokens)) ? Number(apiConfig.maxTokens) : 1200;
      if (!prompt || !reqId) {
        postSecondaryReply(reqId, '', { ok: false, error: 'empty_prompt' });
        return;
      }
      if (!baseUrl || !model) {
        postSecondaryReply(reqId, '', { ok: false, error: 'missing_config' });
        return;
      }
      const url = baseUrl.endsWith('/chat/completions') ? baseUrl : `${baseUrl}/chat/completions`;
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model,
            messages: [{ role: 'user', content: prompt }],
            temperature,
            max_tokens: maxTokens
          })
        });
        if (!res.ok) {
          postSecondaryReply(reqId, '', { ok: false, error: `http_${res.status}` });
          return;
        }
        const json = await res.json();
        const text = String(json?.choices?.[0]?.message?.content || '').trim();
        if (!text) {
          postSecondaryReply(reqId, '', { ok: false, error: 'empty_response' });
          return;
        }
        postSecondaryReply(reqId, text, { ok: true });
      } catch (error) {
        postSecondaryReply(reqId, '', { ok: false, error: String(error?.message || error) });
      }
    }

    async function runTransactionalViaTavernHelper(tavernHelper, promptText, reqId) {
      // 先静默写入当前 user 楼层，确保预设里的 {{lastUserMessage}} 与 user_input
      // 指向同一轮输入。生成失败时按 requestId 回滚，不留下孤儿楼层。
      //
      // generate() 的返回值偶尔不可靠/为空，但酒馆助手会在生成结束时发出
      // GENERATION_ENDED ('js_generation_ended') 事件并带上最终文本。仿 index2 的做法，
      // 用 [事件, generate 返回值, 超时] 做 race，谁先给出非空文本就用谁。
      const eventSource = getContext()?.eventSource;
      const GEN_ENDED = 'js_generation_ended';
      let endedResolve = null;
      const endedPromise = new Promise((resolve) => { endedResolve = resolve; });
      const endedHandler = (finalText, generationId) => {
        try {
          const eventPayload = { text: finalText, generation_id: generationId };
          if (!isGenerationEndedPayloadForRequest(eventPayload, reqId)) return;
          const normalizedText = normalizeGenerationEndedText(eventPayload, reqId);
          if (normalizedText === null) return;
          if (!isGeneratedTextCompatibleWithPrompt(promptText, normalizedText)) return;
          endedResolve(normalizedText);
        } catch (e) {}
      };
      let listening = false;
      const removeEndedListener = () => {
        if (!listening) return;
        try {
          if (typeof eventSource.removeListener === 'function') eventSource.removeListener(GEN_ENDED, endedHandler);
          else if (typeof eventSource.off === 'function') eventSource.off(GEN_ENDED, endedHandler);
        } catch (e) {}
        listening = false;
      };

      let userIndex = -1;
      try {
        userIndex = await createSilentChatMessage('user', promptText, reqId);
        await persistChatSilently();
      } catch (error) {
        if (userIndex >= 0) {
          rollbackSilentUserMessage(userIndex, reqId);
          try { await persistChatSilently(); } catch (persistError) {}
        }
        postCommittedReply(reqId, '', { isFinal: true });
        throw error;
      }
      if (eventSource && typeof eventSource.on === 'function') {
        try { eventSource.on(GEN_ENDED, endedHandler); listening = true; } catch (e) {}
      }
      let generatedText = '';
      try {
        const generatePromise = Promise.resolve(tavernHelper.generate({
          user_input: promptText,
          should_stream: false,
          // 不静默：与 index2 一致，让酒馆底部显示生成/停止标志。
          should_silence: false,
          generation_id: reqId
        }));
        const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve(''), 120000));
        const raced = await Promise.race([endedPromise, generatePromise, timeoutPromise]);
        generatedText = extractReplyTextFromGenerated(raced);
        if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
        if (!generatedText) {
          // race 先返回的是空：再等 generate 自身的返回值兜底。
          try {
            generatedText = extractReplyTextFromGenerated(await generatePromise);
            if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
          } catch (e) {}
        }
        if (!generatedText && listening) {
          // generate 可能先返回空值，但真正正文稍后才通过 scoped end event 到达。
          const lateText = await Promise.race([
            endedPromise,
            timeoutPromise
          ]);
          generatedText = extractReplyTextFromGenerated(lateText);
          if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
        }
      } catch (error) {
        removeEndedListener();
        rollbackSilentUserMessage(userIndex, reqId);
        await persistChatSilently();
        postCommittedReply(reqId, '', { isFinal: true });
        throw error;
      }
      removeEndedListener();
      if (!generatedText) {
        rollbackSilentUserMessage(userIndex, reqId);
        await persistChatSilently();
        postCommittedReply(reqId, '', { isFinal: true });
        return;
      }
      await createSilentChatMessage('assistant', generatedText, reqId);
      await persistChatSilently();
      const assistantMessageId = getContext()?.chat?.length - 1;
      postCommittedReply(reqId, generatedText, {
        isFinal: true,
        rawText: generatedText,
        renderedText: '',
        messageId: assistantMessageId
      });
    }

    async function runTransactionalPrompt(prompt, requestId, channelLeaseId) {
      const context = getContext();
      const promptText = String(prompt || '').trim();
      const reqId = String(requestId || '');
      if (!context || !promptText || !reqId) return;
      if (!requestPromptCache.has(reqId)) requestPromptCache.set(reqId, promptText);
      pendingRequestId = reqId;
      pendingChannelLeaseId = String(channelLeaseId || '');
      clearReplyCandidateState();

      const tavernHelper = getTavernHelper();
      if (tavernHelper) {
        await runTransactionalViaTavernHelper(tavernHelper, promptText, reqId);
        return;
      }

      const txnStartedAt = Date.now();
      const userIndex = await createSilentChatMessage('user', promptText, reqId);
      await persistChatSilently();
      const assistantStartIndex = Array.isArray(context.chat) ? context.chat.length : 0;
      let generatedText = '';
      let existingAssistantHit = null;
      try {
        const generated = await context.generate?.('quiet');
        generatedText = extractReplyTextFromGenerated(generated);
        if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
        if (!generatedText) {
          existingAssistantHit = await waitForLatestAssistantReply(reqId, assistantStartIndex, txnStartedAt);
          generatedText = existingAssistantHit?.text || '';
          if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
        }
      } catch (error) {
        rollbackSilentUserMessage(userIndex, reqId);
        await persistChatSilently();
        postCommittedReply(reqId, '', { isFinal: true });
        throw error;
      }
      if (!generatedText) {
        rollbackSilentUserMessage(userIndex, reqId);
        await persistChatSilently();
        postCommittedReply(reqId, '', { isFinal: true });
        return;
      }
      const assistantResolvedText = generatedText
        || existingAssistantHit?.rawText
        || existingAssistantHit?.renderedText
        || '';
      removeGeneratedAssistantMessagesAfter(assistantStartIndex, reqId);
      await createSilentChatMessage('assistant', assistantResolvedText, reqId);
      await persistChatSilently();
      const assistantMessageId = getContext()?.chat?.length - 1;
      postCommittedReply(reqId, assistantResolvedText, {
        isFinal: true,
        rawText: existingAssistantHit?.rawText || assistantResolvedText,
        renderedText: existingAssistantHit?.renderedText || '',
        messageId: assistantMessageId
      });
    }

    function postCharacterToFrame() {
      const contextInfo = getCurrentContextInfo();
      const savedState = getSavedChatState();
      console.log('[st.html] postCharacterToFrame sending payload:', contextInfo.character, 'hasSavedState:', Boolean(savedState));
      const payload = {
        source: 'hatsuboshi-produce-host',
        type: 'character',
        character: contextInfo.character,
        saveScope: contextInfo.saveScope,
        hasSavedState: Boolean(savedState),
        savedState,
      };
      window.postMessage(payload, '*');
    }

    function sendPromptToSillyTavern(prompt) {
      const text = String(prompt || '').trim();
      if (!text) return;
      
      const mainDoc = window.parent?.document || document;
      const textarea = mainDoc.querySelector('#send_textarea');
      const sendButton = mainDoc.querySelector('#send_but');
      if (textarea && sendButton) {
        textarea.value = text;
        textarea.dispatchEvent(new Event('input', { bubbles: true }));
        textarea.dispatchEvent(new Event('change', { bubbles: true }));
        pendingPromptSentAt = Date.now();
        const context = getContext();
        pendingPromptChatLength = Array.isArray(context?.chat) ? context.chat.length : 0;
        sendButton.click();
      }
    }

    function bindSillyTavernReplyBridge() {
      try {
        const context = getContext();
        if (!context) return;
        const eventSource = context.eventSource;
        const eventTypes = context.eventTypes;
        if (!eventSource || !eventTypes) return;
        
        eventSource.on(eventTypes.CHARACTER_MESSAGE_RENDERED, (messageId) => {
          sendLatestAiReplyToFrame(messageId, false);
        });

        const handleGenerationEnd = () => {
          const latestMessageId = getContext()?.chat?.length - 1;
          if (latestMessageId >= 0) {
            sendLatestAiReplyToFrame(latestMessageId, true);
          }
        };

        if (eventTypes.GENERATION_STARTED) {
          eventSource.on(eventTypes.GENERATION_STARTED, () => {
            clearReplyCandidateState();
          });
        }
        if (eventTypes.STREAM_TOKEN_RECEIVED) {
          eventSource.on(eventTypes.STREAM_TOKEN_RECEIVED, () => {
            const latestMessageId = getContext()?.chat?.length - 1;
            if (latestMessageId >= 0) {
              sendLatestAiReplyToFrame(latestMessageId, false);
            }
          });
        }
        if (eventTypes.GENERATION_STOPPED) {
          eventSource.on(eventTypes.GENERATION_STOPPED, handleGenerationEnd);
        }
        if (eventTypes.MESSAGE_RECEIVED) {
          eventSource.on(eventTypes.MESSAGE_RECEIVED, (messageId) => {
            sendLatestAiReplyToFrame(messageId, true);
          });
        }
        if (eventTypes.MESSAGE_SWIPED) {
          eventSource.on(eventTypes.MESSAGE_SWIPED, (messageId) => {
            sendLatestAiReplyToFrame(messageId, true);
          });
        }
      } catch (error) {
        console.warn('[初星直接桥接] 无法绑定角色回复监听。', error);
      }
    }

    function sendLatestAiReplyToFrame(messageId, isFinal = true) {
      if (!pendingRequestId) return;
      collectAndSendAiReply(messageId, isFinal);
    }

    function dispatchCommittedReplyEvent(payload) {
      try {
        window.dispatchEvent(new CustomEvent(HATSU_COMMIT_EVENT_NAME, { detail: payload }));
      } catch (error) {
        console.warn('[st.html] dispatch commit event failed:', error);
      }
    }

    function getMessageRawText(message) {
      if (!message || message.is_user) return '';
      const swipeIndex = Number.isInteger(message.swipe_id) ? message.swipe_id : 0;
      let rawText = '';
      if (Array.isArray(message.swipes) && message.swipes.length > 0) {
        rawText = String(message.swipes[swipeIndex] || message.swipes[0] || '');
      }
      if (!rawText) {
        rawText = typeof message.mes === 'string' ? message.mes : '';
      }
      return rawText;
    }

    function findLatestUsableAiReplyId(preferredId) {
      const context = getContext();
      const chat = context?.chat;
      if (!Array.isArray(chat)) return Number(preferredId);
      const startIndex = Math.max(1, pendingPromptChatLength);
      const preferredIndex = Number(preferredId);
      if (Number.isInteger(preferredIndex) && preferredIndex >= startIndex) {
        return preferredIndex;
      }
      for (let index = chat.length - 1; index >= startIndex; index -= 1) {
        const message = chat[index];
        if (message && !message.is_user) return index;
      }
      return preferredIndex;
    }

    function collectAndSendAiReply(messageId, isFinal = true) {
      if (Number(messageId) === 0) return;
      if (isFinal && pendingCandidateInFlight) return;
      
      const context = getContext();
      const replyMessageId = findLatestUsableAiReplyId(messageId);
      const message = context?.chat?.[replyMessageId];
      if (!message || message.is_user) {
        // generation stopped 可能早于 assistant 消息真正落到 chat，给一次短延迟重试兜底
        if (isFinal) {
          const latestId = Array.isArray(context?.chat) ? context.chat.length - 1 : Number(messageId);
          if (Number.isInteger(latestId) && latestId >= 0) {
            scheduleReplyRetry(latestId, 350);
          }
        }
        return;
      }

      const rawText = getMessageRawText(message);
      const mainDoc = window.parent?.document || document;
      const renderedText = mainDoc.querySelector(`.mes[mesid="${replyMessageId}"] .mes_text`)?.innerText || '';
      const text = rawText.length > renderedText.length ? rawText : renderedText;

      if (!text.trim()) {
        // SillyTavern may render an empty assistant placeholder before generation produces text.
        if (isFinal) scheduleReplyRetry(replyMessageId, 350);
        return;
      }

      if (!isFinal) {
        // 部分宿主环境偶发不触发 GENERATION_STOPPED/MESSAGE_RECEIVED，防止前端永远停留在“生成中”
        scheduleStreamFinalize(replyMessageId, 1400);
      }

      if (text.trim().length > 0 || isFinal) {
        const payload = {
          source: 'hatsuboshi-produce-host',
          type: useCommittedReplyEvent && isFinal ? 'aiReplyCommitted' : 'aiReply',
          requestId: pendingRequestId,
          channelLeaseId: pendingChannelLeaseId,
          text,
          rawText,
          renderedText,
          isFinal,
          messageId: replyMessageId
        };
        window.postMessage(payload, '*');
        if (useCommittedReplyEvent && isFinal) {
          dispatchCommittedReplyEvent(payload);
        }
        
        if (isFinal) {
          clearStreamFinalizeTimer();
          pendingCandidateInFlight = true;
          pendingCandidateMessageId = Number(replyMessageId);
          scheduleReplyRetry(replyMessageId, 2500);
        }
      }
    }

    function scheduleStreamFinalize(messageId, delay = 1200) {
      if (!pendingRequestId) return;
      if (!Number.isInteger(Number(messageId)) || Number(messageId) < 0) return;
      if (pendingStreamFinalizeTimer) window.clearTimeout(pendingStreamFinalizeTimer);
      pendingStreamMessageId = Number(messageId);
      pendingStreamFinalizeTimer = window.setTimeout(() => {
        pendingStreamFinalizeTimer = 0;
        const fallbackMessageId = pendingStreamMessageId;
        pendingStreamMessageId = -1;
        if (!pendingRequestId) return;
        collectAndSendAiReply(fallbackMessageId, true);
      }, delay);
    }

    function clearStreamFinalizeTimer() {
      if (pendingStreamFinalizeTimer) window.clearTimeout(pendingStreamFinalizeTimer);
      pendingStreamFinalizeTimer = 0;
      pendingStreamMessageId = -1;
    }

    function getChatCompletionMessageText(message) {
      if (!message) return '';
      const content = Array.isArray(message.content)
        ? message.content.map(part => typeof part === 'string' ? part : part?.text || '').join('\n')
        : String(message.content || '');
      return content.trim();
    }

    function removeCurrentTransactionalDuplicateUserPrompt(chat, activeRequestId) {
      if (!activeRequestId || !Array.isArray(chat)) return false;
      const userIndexes = [];
      for (let index = chat.length - 1; index >= 0 && userIndexes.length < 2; index -= 1) {
        if (chat[index]?.role === 'user') userIndexes.push(index);
      }
      if (userIndexes.length < 2) return false;
      const [latestIndex, earlierIndex] = userIndexes;
      const latestText = getChatCompletionMessageText(chat[latestIndex]);
      const earlierText = getChatCompletionMessageText(chat[earlierIndex]);
      if (!latestText || latestText !== earlierText) return false;
      chat.splice(earlierIndex, 1);
      return true;
    }

    function isHatsuFrontendPromptMessage(message) {
      if (!message || message.role !== 'user') return false;
      const content = getChatCompletionMessageText(message);
      return content.includes('初星育成系统') || content.includes('【初星学园 Galgame 渲染规则契约】');
    }

    function pruneHatsuChatCompletionPayload(eventData) {
      if (!eventData || eventData.dryRun || !Array.isArray(eventData.chat)) return;
      removeCurrentTransactionalDuplicateUserPrompt(eventData.chat, pendingRequestId);
      const contextInfo = getCurrentContextInfo();
      const characterName = contextInfo.character?.name || '';
      const isHatsu = characterName.includes('初星学园') || characterName.includes('初星') || characterName.includes('Hatsuboshi');
      if (!isHatsu) return;

      const lastHatsuUserPromptIndex = eventData.chat.reduce((lastIndex, message, index) => {
        return isHatsuFrontendPromptMessage(message) ? index : lastIndex;
      }, -1);
      if (lastHatsuUserPromptIndex === -1) return;

      const filtered = eventData.chat.filter((message, index) => {
        return !isHatsuFrontendPromptMessage(message) || index === lastHatsuUserPromptIndex;
      });
      eventData.chat.splice(0, eventData.chat.length, ...filtered);
    }

    function resolveReplyAck(data, activeRequestId) {
      if (!data?.requestId || data.requestId !== activeRequestId) return 'ignore';
      if (data.accepted) {
        return data.isFinal !== false ? 'accept' : 'ignore';
      }
      return data.retry ? 'retry' : 'cancel';
    }

    function handleReplyAck(data) {
      const resolution = resolveReplyAck(data, pendingRequestId);
      if (resolution === 'ignore') return;
      if (resolution === 'accept' || resolution === 'cancel') {
        clearPendingReplyRequest();
        return;
      }
      pendingCandidateInFlight = false;
      scheduleReplyRetry(pendingCandidateMessageId);
    }

    function scheduleReplyRetry(messageId, delay = 600) {
      if (!pendingRequestId) return;
      if (!Number.isInteger(Number(messageId)) || Number(messageId) < 0) return;
      if (pendingReplyRetryTimer) window.clearTimeout(pendingReplyRetryTimer);
      pendingReplyRetryTimer = window.setTimeout(() => {
        pendingReplyRetryTimer = 0;
        pendingCandidateInFlight = false;
        collectAndSendAiReply(Number(messageId), true);
      }, delay);
    }

    function clearReplyCandidateState() {
      if (pendingReplyRetryTimer) window.clearTimeout(pendingReplyRetryTimer);
      pendingReplyRetryTimer = 0;
      clearStreamFinalizeTimer();
      pendingCandidateInFlight = false;
      pendingCandidateMessageId = -1;
    }

    function clearPendingReplyRequest() {
      clearReplyCandidateState();
      pendingPromptSentAt = 0;
      pendingPromptChatLength = 0;
      pendingRequestId = '';
      pendingChannelLeaseId = '';
    }
  } catch (err) {
    document.getElementById('hatsu-fullscreen-overlay')?.remove();
    showError(err);
  }
})();
</script>
